<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIKKE Overload Reroll Advisor</title>
<style>
  :root{ --bg:#0e1117; --panel:#161b22; --line:#2a323d; --text:#e6edf3; --muted:#9aa7b4; --accent:#4aa3ff; --accent2:#7c5cff; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column}
  .topbar{display:flex;gap:8px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{font-weight:700;margin-right:8px}
  .ttab{padding:7px 18px;border-radius:8px;border:1px solid var(--line);background:#1c232d;cursor:pointer;font-weight:600;user-select:none}
  .ttab:hover{border-color:var(--accent)}
  .ttab.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .hint{color:var(--muted);font-size:12.5px;margin-left:auto}
  iframe{border:0;flex:1;width:100%;display:none;background:var(--bg)}
  iframe.show{display:block}
</style>
</head>
<body>
  <div class="topbar">
    <span class="brand">NIKKE Overload Advisor</span>
    <div class="ttab" id="tabAdv">Whole unit</div>
    <div class="ttab" id="tabSimple">By gear piece</div>
    <span class="hint" id="hintTxt"></span>
  </div>
  <iframe id="fSimple" src="simple.html" title="Simple advisor"></iframe>
  <iframe id="fAdv" src="advanced.html" title="Advanced advisor"></iframe>
<script>
  // Both apps stay loaded; tabs just toggle visibility so each keeps its scroll
  // position and state while you flip between them. Each app has its own save
  // (Simple: nikkeOL, Advanced: nikkeOL2). Last-used tab is remembered.
  const KEY='nikkeOLtabChoice';
  const hints={
    simple:'Per-piece chart advisor — pick a Category per piece, follow the flowchart.',
    adv:'Whole-unit planner — set ×counts like Ele ×4 · ATK ×4 · Ammo ×2 and get one next move across all four pieces.'
  };
  function sel(which){
    document.getElementById('tabSimple').classList.toggle('active',which==='simple');
    document.getElementById('tabAdv').classList.toggle('active',which==='adv');
    document.getElementById('fSimple').classList.toggle('show',which==='simple');
    document.getElementById('fAdv').classList.toggle('show',which==='adv');
    document.getElementById('hintTxt').textContent=hints[which];
    localStorage.setItem(KEY,which);
  }
  document.getElementById('tabSimple').onclick=()=>sel('simple');
  document.getElementById('tabAdv').onclick=()=>sel('adv');
  sel(localStorage.getItem(KEY)==='simple'?'simple':'adv');   // Whole unit is the default
</script>
</body>
</html>
