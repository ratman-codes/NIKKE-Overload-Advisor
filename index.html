<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIKKE Overload Reroll Advisor</title>
<meta name="description" content="Free reroll advisor for NIKKE overload gear. Enter your gear lines and the effects you want and get the cheapest next move, Change Effects, Reset Attributes, Lock or Unlock, from an exact solver, with the expected Custom Module cost. Plans a whole unit or a single piece.">
<link rel="canonical" href="https://ratman-codes.github.io/NIKKE-Overload-Advisor/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="NIKKE Overload Reroll Advisor">
<meta property="og:title" content="NIKKE Overload Reroll Advisor">
<meta property="og:description" content="Free reroll advisor for NIKKE overload gear. Enter your gear lines and the effects you want and get the cheapest next move, Change Effects, Reset Attributes, Lock or Unlock, from an exact solver, with the expected Custom Module cost. Plans a whole unit or a single piece.">
<meta property="og:url" content="https://ratman-codes.github.io/NIKKE-Overload-Advisor/">
<meta name="twitter:card" content="summary">
<style>
  :root{ --bg:#0e1117; --panel:#161b22; --line:#2a323d; --text:#e6edf3; --muted:#9aa7b4; --accent:#4aa3ff; --accentfill:#1d6fd6; --accent2:#7c5cff; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column}
  .topbar{display:flex;gap:8px;align-items:center;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .brand{font-weight:700;margin:0 8px 0 0;font-size:inherit;line-height:inherit}
  .ttab{padding:7px 18px;border-radius:8px;border:1px solid var(--line);background:#1c232d;cursor:pointer;font-weight:600;user-select:none}
  .ttab:hover{border-color:var(--accent)}
  .ttab.active{background:var(--accentfill);border-color:var(--accentfill);color:#fff}
  .treset{padding:7px 14px;border-radius:8px;border:1px solid #5a1f1c;background:#1c232d;color:#ff8a80;cursor:pointer;font-weight:600;font-size:13px;margin-left:6px}
  .treset:hover{border-color:#ff8a80}
  .hint{color:var(--muted);font-size:12.5px;margin-left:auto}
  iframe{border:0;flex:1;width:100%;display:none;background:var(--bg)}
  iframe.show{display:block}
  /* "a newer version is out" bar: hidden until the files on the server differ from the ones loaded */
  .newver{display:none;align-items:center;gap:10px;padding:8px 14px;background:#1b2a1e;border-bottom:1px solid #2f6b3a;color:#cfe9d4;font-size:13.5px}
  .newver.show{display:flex}
  .newver button{padding:6px 14px;border-radius:8px;border:1px solid #3fa35a;background:#2a7a3f;color:#fff;font-weight:600;cursor:pointer}
  .newver button:hover{background:#34944d}
  .newver .later{margin-left:auto;background:none;border-color:transparent;color:var(--muted);font-weight:400}
</style>
</head>
<body>
  <div class="topbar">
    <h1 class="brand">NIKKE Overload Advisor</h1>
    <div class="ttab" id="tabAdv">Whole unit</div>
    <div class="ttab" id="tabSimple">By gear piece</div>
    <button class="treset" id="btnReset" title="Clears the active tab's saved data (requirements/targets and all four gear pieces)">🗑 Reset</button>
    <span class="hint" id="hintTxt"></span>
    <img id="hitBadge" alt="hits" title="Anonymous view counter" style="height:18px;margin-left:12px;opacity:.8" src="https://hitcount.dev/p/ratman-codes/nikke-overload-advisor.svg">
  </div>
  <div class="newver" id="newVer"><span>A newer version of this tool is out. Your entered gear and targets are saved and will still be there.</span><button id="newVerGo">Refresh now</button><button class="later" id="newVerLater">Later</button></div>
  <iframe id="fSimple" src="simple.html" title="Simple advisor"></iframe>
  <iframe id="fAdv" src="advanced.html" title="Advanced advisor"></iframe>
<script>
  // Both apps stay loaded; tabs just toggle visibility so each keeps its scroll
  // position and state while you flip between them. Each app has its own save
  // (Simple: nikkeOL, Advanced: nikkeOL2). Last-used tab is remembered.
  const KEY='nikkeOLtabChoice';
  const hints={
    simple:'Pick the effects you want on one piece, then follow the roll advice.',
    adv:'Pick the effects you want on all four pieces, then follow the roll advice.'
  };
  function sel(which){
    document.getElementById('tabSimple').classList.toggle('active',which==='simple');
    document.getElementById('tabAdv').classList.toggle('active',which==='adv');
    document.getElementById('fSimple').classList.toggle('show',which==='simple');
    document.getElementById('fAdv').classList.toggle('show',which==='adv');
    document.getElementById('hintTxt').textContent=hints[which];
    localStorage.setItem(KEY,which);
  }
  document.getElementById('tabSimple').onclick=()=>sel('simple');
  document.getElementById('tabAdv').onclick=()=>sel('adv');
  // Reset acts on whichever tab is showing; each inner app owns its confirm + wipe.
  document.getElementById('btnReset').onclick=()=>{
    const which=document.getElementById('tabSimple').classList.contains('active')?'fSimple':'fAdv';
    // a message, not a direct call: from a file:// path the browser treats each page as a different origin and
    // blocks the call; the page resets itself when it hears the message
    document.getElementById(which).contentWindow.postMessage({nikkeOL:'reset'},'*');
  };
  sel(localStorage.getItem(KEY)==='simple'?'simple':'adv');   // Whole unit is the default

  // New-version check. No version number to maintain. Every minute (and when the tab is shown again) the three
  // files are asked for with HEAD requests that bypass the browser cache. A changed ETag / Last-Modified is only a
  // hint: GitHub Pages re-stamps EVERY file with the build time on every push, even a push that touched only the
  // solver tools or the README (Nov 2026: the bar showed with no page change). So a changed stamp triggers one
  // download of that file, and the bar appears only when its CONTENT differs from what was there at load, and the
  // same new content is seen on two checks in a row (a lagging CDN copy cannot trip it). Does nothing from a
  // file:// path. The inner pages keep their saves in localStorage, so a refresh loses nothing.
  (function(){
    if(location.protocol==='file:') return;
    const FILES=['index.html','advanced.html','simple.html'];
    const stamp=async f=>{ try{ const r=await fetch(f+'?v='+Date.now(),{method:'HEAD',cache:'no-store'}); if(!r.ok) return null; return r.headers.get('etag')||r.headers.get('last-modified')||null; }catch(e){ return null; } };
    const hashOf=async t=>{ try{ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)); return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join(''); }catch(e){ let h=0; for(let i=0;i<t.length;i++) h=(h*31+t.charCodeAt(i))|0; return t.length+':'+h; } };
    const content=async f=>{ try{ const r=await fetch(f+'?v='+Date.now(),{cache:'no-store'}); return r.ok?await hashOf(await r.text()):null; }catch(e){ return null; } };
    const base={}, seen={}; let ready=false, dismissed=false;
    const bar=document.getElementById('newVer');
    document.getElementById('newVerGo').onclick=()=>location.reload();
    document.getElementById('newVerLater').onclick=()=>{ dismissed=true; bar.classList.remove('show'); };
    async function init(){ for(const f of FILES) base[f]={stamp:await stamp(f),hash:await content(f)}; ready=true; }
    async function check(){
      if(dismissed||!ready) return;
      for(const f of FILES){
        const st=await stamp(f); if(!st||!base[f].stamp||st===base[f].stamp){ seen[f]=null; continue; }
        const h=await content(f); if(!h||!base[f].hash) continue;
        if(h===base[f].hash){ base[f].stamp=st; seen[f]=null; continue; }   // re-stamped, same page: not an update
        if(seen[f]===h){ bar.classList.add('show'); return; }               // the same new content twice: real
        seen[f]=h;
      }
    }
    init();
    // Every minute: three tiny HEAD requests; a file is only downloaded when its stamp changed.
    setInterval(check,60*1000);
    document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') check(); });
  })();
</script>
</body>
</html>
